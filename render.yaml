services:
  - type: web
    name: clinical-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 20
